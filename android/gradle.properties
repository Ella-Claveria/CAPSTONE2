# --enable-native-access: Gradle loads native libraries, which Java 24+
# (Android Studio's bundled Java is 25) warns about on every build.
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

