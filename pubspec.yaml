name: agritrade
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  image_picker: ^1.1.2
  cloudinary_public: ^0.23.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  intl: 0.20.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.5.3
  geolocator: ^13.0.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^13.1.0
  excel: ^4.0.6
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  cloud_functions: ^6.5.0
  web: ^1.1.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/google_logo.svg
    - assets/images/onboarding_1_farming.png
    - assets/images/onboarding_2_connection.png
    - assets/images/onboarding_3_marketplace.png
    - assets/images/login_hero.png
    - assets/images/bg_admin.png
    - assets/images/bg_panel.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon_flat.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"